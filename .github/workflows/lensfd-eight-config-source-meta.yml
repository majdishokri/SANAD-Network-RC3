name: Rice LensFD eight publisher-original SDR mapping and raw RF source audit
on:
  push:
    branches: [feature/lensfd-rx-chain-metadata-v3]
    paths:
      - generalized/tests/lensfd_eight_config_raw_iq_metadata_audit.py
      - generalized/real_rf_v1/raw_iq_quality.py
      - .github/workflows/lensfd-eight-config-source-meta.yml
  workflow_dispatch:
jobs:
  eight-original-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed numerical dependencies
        run: python -m pip install numpy==2.3.5 h5py==3.15.1 pytest
      - name: Run seven fail-closed raw IQ gate tests
        run: python -m pytest -q generalized/real_rf_v1/test_raw_iq_quality.py
      - name: Examine eight original Rice RF captures and HDF5 source hardware metadata
        run: python -m generalized.tests.lensfd_eight_config_raw_iq_metadata_audit
