name: Rice LensFD cross-hub SDR board serial and original RC3 preflight
on:
  push:
    branches: [feature/lensfd-rx-chain-metadata-v3]
    paths:
      - generalized/tests/lensfd_cross_hub_sdr_serial_audit.py
      - generalized/real_rf_v1/quality_gated_bridge.py
      - generalized/real_rf_v1/test_quality_gated_bridge.py
      - .github/workflows/lensfd-shared-sdr-and-raw-gate.yml
  workflow_dispatch:
jobs:
  original-Rice-hardware-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native HDF5 and regression-test prerequisites
        run: python -m pip install numpy==2.3.5 h5py==3.15.1 scipy==1.17.1 scikit-learn==1.8.0 joblib==1.5.3 pytest
      - name: Test original frozen RC3 optional preflight wrapper only, no classifier changes
        run: python -m pytest -q generalized/real_rf_v1/test_quality_gated_bridge.py
      - name: Hash-verify two original RF sources, inspect all 40 SDR IDs and compare positions
        run: python -m generalized.tests.lensfd_cross_hub_sdr_serial_audit
