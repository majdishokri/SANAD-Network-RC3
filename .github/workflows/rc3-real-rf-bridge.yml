name: RC3 strict measured-RF bridge qualification gates
on:
  push:
    branches:
      - feature/rc3-real-rf-bridge-v2
    paths:
      - "generalized/real_rf_v1/**"
      - ".github/workflows/rc3-real-rf-bridge.yml"
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime deps and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test 15-min conditioning and exact legacy CSI-to-evidence bridge
        run: |
          python -m pytest -q generalized/real_rf_v1/test_conditioning.py generalized/real_rf_v1/test_rc3_bridge.py
      - name: Reconfirm frozen 7x8 bit-for-bit parity / variable geometry interface
        run: python generalized/tests/test_dimensions.py
