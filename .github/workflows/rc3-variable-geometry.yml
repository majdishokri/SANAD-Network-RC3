name: RC3 generalized shape checks
on:
  push:
    branches: [feature/rc3-variable-geometry]
  workflow_dispatch:
jobs:
  shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python generalized/tests/test_dimensions.py
