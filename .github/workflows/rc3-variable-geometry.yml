name: RC3 generalized shape checks
on:
  push:
    branches: [feature/rc3-variable-geometry]
  workflow_dispatch:
jobs:
  shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check frozen tracked files remain byte-identical
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('FREEZE_MANIFEST.json').read_text())
          for filename,expected in m['files_sha256'].items():
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest()==expected,filename
          print('PASS: all original frozen tracked files unchanged')
          PY
      - run: python qualification/verify_qualification.py
      - run: python generalized/tests/test_dimensions.py
