name: SANAD independent DICHASUS real 64-channel TFRecord sample validation
on:
  push:
    branches: [feature/rc3-independent-measured-rf-ood-v1]
    paths:
      - generalized/tests/dichasus_original_tfrecord_prefix_inspector.py
      - .github/workflows/rc3-dichasus-native-tfrecord-prefix.yml
  workflow_dispatch:
jobs:
  source-native-64:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lean standard TFRecord parsing libraries
        run: python -m pip install requests google-crc32c tfrecord protobuf numpy
      - name: Fetch original measured CSI TFRecords via DaRUS and validate record checksums and native field structure
        run: python -m generalized.tests.dichasus_original_tfrecord_prefix_inspector
