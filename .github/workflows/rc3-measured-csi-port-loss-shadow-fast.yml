name: SANAD frozen RC3 measured DICHASUS port-loss targeted smoke (7 digital cases)
on:
  push:
    branches: [feature/rc3-independent-measured-rf-ood-v1]
    paths:
      - .github/workflows/rc3-measured-csi-port-loss-shadow-fast.yml
  workflow_dispatch:
jobs:
  port-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen original and source CSI prerequisites
        run: python -m pip install numpy==2.3.5 scipy==1.17.1 scikit-learn==1.8.0 joblib==1.5.3 requests google-crc32c tfrecord protobuf tensorboard
      - name: True frozen RC3 on 7 prospective digital -20dB target changes on original source RF
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
        run: python -m generalized.tests.dichasus_frozen_rc3_measured_shadow --blocks 1 --scenarios port_loss --out-dir out/real_csi_port_loss
      - name: Upload source-derived metrics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sanad-rc3-real-csi-port-loss-7-case
          path: out/real_csi_port_loss
          if-no-files-found: error
