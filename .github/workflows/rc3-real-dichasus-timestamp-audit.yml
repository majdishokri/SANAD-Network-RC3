name: Audit DICHASUS genuine recorded CSI timestamps
on:
  push:
    branches:
      - feature/rc3-real-rf-bridge-v2
    paths:
      - "generalized/real_rf_v1/dichasus_real_timestamp_audit.py"
      - "generalized/real_rf_v1/test_dichasus_real_timestamp_audit.py"
      - ".github/workflows/rc3-real-dichasus-timestamp-audit.yml"
  workflow_dispatch:
jobs:
  measured-native-time:
    strategy:
      fail-fast: false
      matrix:
        dataset: [ad25, ad21]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy and pytest
        run: python -m pip install numpy==2.3.5 pytest
      - name: Verify raw TFRecord time decoder with fixtures
        run: python -m pytest -q generalized/real_rf_v1/test_dichasus_real_timestamp_audit.py
      - name: Download integrity-locked prefix and audit original recorded times
        run: |
          python -m generalized.real_rf_v1.dichasus_real_timestamp_audit \
            --dataset ${{ matrix.dataset }} \
            --out results/dichasus_${{ matrix.dataset }}_authentic_timing.json
      - name: Preserve evidence report (not raw copyrighted CSI)
        uses: actions/upload-artifact@v4
        with:
          name: dichasus-${{ matrix.dataset }}-native-timestamp-audit
          path: results/dichasus_${{ matrix.dataset }}_authentic_timing.json
          if-no-files-found: error
