name: Rice LensFD raw pilot-IQ versus processed CSI port anomaly
on:
  push:
    branches: [feature/lensfd-failure-origin-audit]
    paths:
      - generalized/tests/lensfd_raw_iq_port_origin.py
      - .github/workflows/lensfd-raw-iq-port-audit.yml
  workflow_dispatch:
jobs:
  compare-raw-and-processed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HDF5 and numpy
        run: python -m pip install "numpy==2.3.5" "h5py==3.15.1"
      - name: Download raw Rice HDF5 and measure original IQ port energy
        run: python -m generalized.tests.lensfd_raw_iq_port_origin
