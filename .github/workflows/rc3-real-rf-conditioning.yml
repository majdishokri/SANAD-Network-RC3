name: RC3 real RF conditioning tests
on:
  push:
    branches:
      - feature/rc3-real-rf-conditioning-v1
    paths:
      - "generalized/real_rf_v1/**"
      - ".github/workflows/rc3-real-rf-conditioning.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Execute measured RF adapter unit and guard tests
        run: python -m pytest -q generalized/real_rf_v1/test_conditioning.py
      - name: Check bit-for-bit frozen 7x8 parity and variable geometry shapes
        run: python generalized/tests/test_dimensions.py
