name: SANAD Adaptive Core Tests

on:
  pull_request:
    paths:
      - 'adaptive/**'
      - '.github/workflows/adaptive-tests.yml'
  push:
    branches:
      - 'feature/adaptive-core-v0.1'
    paths:
      - 'adaptive/**'
      - '.github/workflows/adaptive-tests.yml'

jobs:
  adaptive-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e adaptive
      - run: python -m unittest discover -s adaptive/tests -v
