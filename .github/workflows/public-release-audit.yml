name: Public release security and frozen artifact integrity
on:
  push:
    branches:
      - public/rc3-accelerated-release-cleanup
      - main
  workflow_dispatch:
jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan committed code, docs, notebooks and frozen ZIP without displaying secrets
        run: python scripts/audit_public_repository.py
      - name: Verify immutable original RC3 code and model digests
        run: python verify_freeze.py
      - name: Verify frozen 144-seed research qualification summary and lock
        run: python qualification/verify_qualification.py
      - name: Verify accelerated frozen release archive and recorded parity
        run: python accelerated_v1/verify_frozen_release.py
      - name: Load checksum-verified original frozen RC3 model
        run: |
          python -m pip install -r requirements.txt
          python -c "from rc3 import FrozenRC3; m=FrozenRC3(); assert m.threshold == 0.50; print('PASS: frozen RC3 loaded, unchanged threshold 0.50')"
