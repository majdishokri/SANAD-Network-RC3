[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad-network-adaptive"
version = "0.1.0"
description = "Research-only geometry-aware variable-size RF integrity prototype (not frozen RC3)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sanad_adaptive*"]
